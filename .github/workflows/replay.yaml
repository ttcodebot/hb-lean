name: replay
run-name: "replay ${{ inputs.project }} on ${{ inputs.image }}"
on:
  workflow_dispatch:
    inputs:
      project:
        required: true
      image:
        required: true
      tt_args:
        default: ""
permissions:
  contents: read
  packages: read
defaults:
  run:
    shell: bash
jobs:
  replay:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}:${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      TT_ARGS: ${{ inputs.tt_args }}
    steps:
      - name: checkout project
        uses: actions/checkout@v6
        with:
          repository: ttcodebot/${{ inputs.project }}
          submodules: recursive
      - name: checkout tt-support-tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          path: tt
      - name: checkout experiment
        uses: actions/checkout@v6
        with:
          path: exp
      - name: Fetch verilog and build config
        run: /opt/tt/bin/python tt/tt_tool.py --create-user-config $TT_ARGS
      - name: Harden with LibreLane (recording each OpenROAD step's environment)
        run: |
          export REAL_OPENROAD=$(command -v openroad)
          mkdir -p /tmp/wrap && cp exp/replay/openroad-wrapper.sh /tmp/wrap/openroad
          export PATH=/tmp/wrap:$PATH
          START=$(date +%s.%N)
          /opt/tt/bin/python tt/tt_tool.py --harden --no-docker $TT_ARGS
          echo "LIBRELANE_WALL=$(echo "$(date +%s.%N) - $START" | bc -l 2>/dev/null || python3 -c "import time;print(time.time()-$START)")" >> $GITHUB_ENV
      - name: Replay PnR steps in one OpenROAD process
        run: |
          cd runs/wokwi
          STEPS=""
          for d in [0-9]*-openroad-*; do
            n=${d%%-*}
            [ -f $d/_proc_env ] && [ -f $d/COMMANDS ] || continue
            head -1 $d/COMMANDS | grep -q -- " -python " && continue
            head -1 $d/COMMANDS | grep -qE "^openroad .*openroad/(gpl|repair_design|dpl|cts|rsz_timing_postcts|rsz_timing_postgrt|repair_design_postgrt|grt|antenna_check|antenna_repair|drt|fill|sta/corner)\.tcl$" || continue
            [ "$((10#$n))" -ge "$((10#$(ls -d *-openroad-globalplacement | head -1 | cut -d- -f1)))" ] || continue
            [ "$((10#$n))" -le "$((10#$(ls -d *-openroad-fillinsertion | head -1 | cut -d- -f1)))" ] || continue
            STEPS="$STEPS $PWD/$d"
          done
          echo "steps:$STEPS" | tr ' ' '\n'
          mkdir -p /tmp/replay-out /tmp/replay-noreports
          export REPLAY_STEPS="$STEPS" REPLAY_OUT=/tmp/replay-out
          for run in 1 2; do
            START=$(python3 -c "import time;print(time.time())")
            openroad -exit -no_splash -metrics /tmp/replay-out/metrics.json $GITHUB_WORKSPACE/exp/replay/replay.tcl > /tmp/replay-out/replay-$run.log 2>&1 || { tail -60 /tmp/replay-out/replay-$run.log; exit 1; }
            WALL=$(python3 -c "import time;print(round(time.time()-$START,2))")
            echo "replay run $run wall: $WALL s"
          done
          python3 $GITHUB_WORKSPACE/exp/replay/compare.py . /tmp/replay-out/replay-2.log $WALL | tee -a $GITHUB_STEP_SUMMARY
          echo "LibreLane harden wall: $LIBRELANE_WALL s" | tee -a $GITHUB_STEP_SUMMARY
          # Variant: PnR steps only, without the mid-PnR STA and antenna report steps.
          export REPLAY_STEPS="$(echo $STEPS | tr ' ' '\n' | grep -vE 'stamidpnr|checkantennas' | tr '\n' ' ')" REPLAY_OUT=/tmp/replay-noreports
          START=$(python3 -c "import time;print(time.time())")
          openroad -exit -no_splash -metrics /tmp/replay-noreports/metrics.json $GITHUB_WORKSPACE/exp/replay/replay.tcl > /tmp/replay-noreports/replay.log 2>&1 || { tail -60 /tmp/replay-noreports/replay.log; exit 1; }
          echo "replay without report steps wall: $(python3 -c "import time;print(round(time.time()-$START,2))") s" | tee -a $GITHUB_STEP_SUMMARY
          grep REPLAY_ /tmp/replay-noreports/replay.log
          mkdir -p /tmp/replay-resdc
          export REPLAY_OUT=/tmp/replay-resdc REPLAY_RESDC=1
          openroad -exit -no_splash $GITHUB_WORKSPACE/exp/replay/replay.tcl > /tmp/replay-resdc/replay.log 2>&1 || tail -30 /tmp/replay-resdc/replay.log
          unset REPLAY_RESDC
          grep REPLAY_TOTAL /tmp/replay-resdc/replay.log || true
          sig() { grep -hE "Inserted [0-9]+ (buffers|tie|hold)|Found [0-9]+ (slew|fanout|cap|long)|Total wire length = |Number of violations|Total number of vias|Clock .* Sinks|Created [0-9]+ clock|design__instance__count |HPWL after|Complete detail routing" "$@" | sed 's/ *$//' ; }
          echo "== signature: LibreLane"; cat $(for d in $STEPS; do ls $d/*.log; done) | sig /dev/stdin | tee /tmp/sig-ll.txt
          echo "== signature: replay"; sig /tmp/replay-out/replay-2.log | tee /tmp/sig-replay.txt
          echo "== signature: replay without report steps"; sig /tmp/replay-noreports/replay.log | tee /tmp/sig-nr.txt
          echo "== diff LibreLane vs replay"; diff /tmp/sig-ll.txt /tmp/sig-replay.txt && echo IDENTICAL || true
          echo "== diff LibreLane vs replay re-reading SDC each step"; sig /tmp/replay-resdc/replay.log > /tmp/sig-resdc.txt; diff /tmp/sig-ll.txt /tmp/sig-resdc.txt && echo IDENTICAL || true
          echo "== diff LibreLane vs replay-noreports"; diff /tmp/sig-ll.txt /tmp/sig-nr.txt && echo IDENTICAL || true
      - name: Upload
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: replay
          path: |
            /tmp/replay-out
            /tmp/replay-noreports
            /tmp/sig-*.txt
            runs/wokwi/*/runtime.txt
            runs/wokwi/flow.log
